# Local dev/testing only — Railway does not consume this file directly (each
# service is defined in its dashboard/CLI instead). Kept because it's the
# fastest way to smoke-test the Dockerfile + migrations against a real
# pgvector Postgres before pushing anywhere. See DEPLOY.md for the real deploy.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: yoink
      POSTGRES_USER: yoink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yoink -d yoink"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://yoink:${POSTGRES_PASSWORD}@db:5432/yoink
    env_file:
      - .env.production        # everything else: tokens, keys, PUBLIC_URL...
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  pgdata:
