name: Deploy

# Auto-deploy on every push to main is handled NATIVELY by the GitHub
# integrations (preferred path for 2026-08+):
#   web      → Vercel project yoinky-web  (root = packages/web) → app.meetyoinky.com
#   backend  → Railway service backend   (Dockerfile at repo root) → bot.meetyoinky.com
# This workflow is a manual-dispatch fallback only (avoids double-deploy on push).
# To re-enable CI-driven deploys, add repo secrets and restore the `push:` trigger:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, RAILWAY_TOKEN
#
# Company Narrative Engine + knowledge-first web shell ships on the same path;
# migrations 0043–0053 run automatically when the Railway backend boots.
on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: web → Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN not set — skipping web deploy. Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID repo secrets to enable auto-deploy."
            exit 0
          fi
          npm i -g vercel@latest
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"

  backend:
    name: backend → Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN not set — skipping backend deploy. Add a RAILWAY_TOKEN (project token) repo secret to enable auto-deploy."
            exit 0
          fi
          npm i -g @railway/cli
          railway up --service backend --detach
