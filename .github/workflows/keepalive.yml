name: Keep Render service awake

# Render's free tier spins the service down after 15 minutes with no incoming
# request. This pings /health every 10 minutes so it never gets the chance —
# no third-party account needed, this repo's own free GitHub Actions minutes
# cover it easily, well under the free monthly quota even on a private repo.
#
# GitHub's scheduled runs are best-effort: under load they get delayed or
# skipped, so the gap between pings can stretch past 15 minutes and the service
# sleeps anyway. When that happens the NEXT ping hits a cold start — this app's
# boot (Docker image, migrations, pg-boss, webhook setup) takes 30-60s. The ping
# must survive that, or it times out, the job goes red, and GitHub emails a
# false alarm for a service that is actually fine (the ping itself woke it).
#
# So: a generous per-attempt timeout that outlasts a cold start, plus retries
# that ride out the wake-up. It only fails — and only then emails — if every
# attempt fails, i.e. the service is genuinely down.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: >-
          curl -sSf
          --max-time 90
          --retry 3
          --retry-delay 20
          --retry-all-errors
          https://yoinkybot.onrender.com/health
