name: Keep Render service awake

# Render's free tier spins the service down after 15 minutes with no incoming
# request. This pings /health every 10 minutes so it never gets the chance —
# no third-party account needed, this repo's own free GitHub Actions minutes
# cover it easily (a few seconds per run, every 10 minutes, well under the
# free monthly quota even on a private repo).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf --max-time 15 https://yoinkybot.onrender.com/health
