name: Migrate to Supabase

# Runs the Neon → Supabase migration from GitHub Actions.
#
# WHY CI AND NOT A LAPTOP. Outbound port 5432 is blocked on at least one machine
# involved in this project — verified: TCP to the production Neon host on 5432 times
# out, as does every Supabase pooler region. That failure mode is genuinely
# confusing, because it looks exactly like bad credentials. GitHub's runners have
# unrestricted egress, so this sidesteps it entirely and means the migration does
# not depend on whose network it runs from.
#
# MANUAL DISPATCH ONLY, with a typed confirmation. This moves a production database;
# it must never fire off a push, a schedule, or a stray click.
#
# REQUIRED repo secrets (Settings → Secrets and variables → Actions):
#   NEON_SOURCE_URL     — production Neon, UNPOOLED (no '-pooler' in the hostname).
#                         From: railway variables --service backend --kv | grep DATABASE_URL
#                         or the Neon dashboard → Connect → deselect "Connection pooling".
#   SUPABASE_DIRECT_URL — Supabase SESSION pooler, port 5432.
#                         From: Supabase dashboard → Connect → "Session pooler".
#
# Neon is only ever READ. It remains a complete rollback afterwards — do not delete
# the Neon project until the app has run happily on Supabase for a few days.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE to confirm you are moving the production database'
        required: true
        default: ''

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'MIGRATE'
        run: |
          echo "::error::Confirmation not given. Re-run and type MIGRATE in the input box."
          exit 1

      - uses: actions/checkout@v4

      # pg_dump refuses to run against a server newer than itself. Pin the client
      # rather than trusting the runner image, which lags.
      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Preflight (read-only, changes nothing)
        env:
          NEON_SOURCE_URL: ${{ secrets.NEON_SOURCE_URL }}
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: bash packages/backend/scripts/migrate-to-supabase.sh --check

      - name: Migrate and verify
        env:
          NEON_SOURCE_URL: ${{ secrets.NEON_SOURCE_URL }}
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: bash packages/backend/scripts/migrate-to-supabase.sh

      # Keep the dump regardless of outcome — if verification failed, this is the
      # artefact you diagnose from, and it saves re-opening a paid Neon export
      # window just to look at the data again.
      - name: Upload the dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-dump-${{ github.run_id }}
          path: |
            neon-*.dump
            neon-*.dump.restore.log
          retention-days: 30
          if-no-files-found: warn
